<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Inventory{% endblock %}</title>
  <!-- Add css file path, using static folder-->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Add icon library -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
  <header>
    <a href="/">Inventory</a>
    <div>
      <a href="/item/new" class="btn">+ New item</a>
      
      <a href="/settings" class="btn btn-hover">
        <i class="fa fa-cog"></i>
        <span class="label">Settings</span>
      </a>
    </div>
    
  </header>
  <main>{% block content %}{% endblock %}</main>

  <!-- Global PDF viewer modal -->
  <div id="pdf-modal" class="pdf-modal hidden">
    <div class="pdf-modal-inner">
      <div class="pdf-modal-header">
        <span id="pdf-modal-filename"></span>
        <button type="button" class="pdf-modal-close" onclick="closePdfModal()">&times;</button>
      </div>
      <iframe id="pdf-modal-frame" src=""></iframe>
    </div>
  </div>

  <script>
    function openPdfModal(url, filename) {
      document.getElementById('pdf-modal-frame').src = url;
      document.getElementById('pdf-modal-filename').textContent = filename || '';
      document.getElementById('pdf-modal').classList.remove('hidden');
    }

    function closePdfModal() {
      document.getElementById('pdf-modal').classList.add('hidden');
      document.getElementById('pdf-modal-frame').src = '';
    }

    document.getElementById('pdf-modal').addEventListener('click', function (e) {
      if (e.target === this) closePdfModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closePdfModal();
    });

    // Global delegated handler: any element with data-pdf-url opens the PDF
    // modal instead of navigating. No inline onclick strings needed anywhere,
    // so filenames with quotes/special characters can't break anything.
    document.addEventListener('click', function (e) {
      const trigger = e.target.closest('[data-pdf-url]');
      if (trigger) {
        e.preventDefault();
        openPdfModal(trigger.dataset.pdfUrl, trigger.dataset.pdfFilename || '');
      }
    });
  </script>
</body>

</html>

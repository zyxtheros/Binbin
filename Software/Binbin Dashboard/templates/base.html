<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Item Catalog{% endblock %}</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f4f4f5;
      color: #1a1a1a;
    }

    header {
      background: #1e3a5f;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header a {
      color: white;
      text-decoration: none;
      font-size: 1.2rem;
      font-weight: 600;
    }

    header .btn {
      background: rgba(255, 255, 255, 0.15);
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 500;
    }

    main {
      max-width: 960px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 1.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    .badge {
      display: inline-block;
      background: #e8f0fe;
      color: #1e3a5f;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 99px;
      font-weight: 600;
    }

    a {
      color: #1e3a5f;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 0.25rem;
    }

    h2 {
      font-size: 1.1rem;
      margin-bottom: 1rem;
      color: #444;
      border-bottom: 1px solid #eee;
      padding-bottom: 0.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid #f0f0f0;
      font-size: 0.95rem;
    }

    td:first-child {
      color: #666;
      width: 40%;
    }

    td:last-child {
      font-weight: 500;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 0.25rem;
      font-weight: 500;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 0.5rem 0.7rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      margin-bottom: 1rem;
      font-family: inherit;
    }

    button,
    .button {
      background: #1e3a5f;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 500;
      text-decoration: none;
      display: inline-block;
    }

    button.secondary,
    .button.secondary {
      background: #888;
    }

    button.danger,
    .button.danger {
      background: #b3261e;
    }

    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid #f0f0f0;
    }

    .field-row:last-child {
      border-bottom: none;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 1rem;
    }
  </style>
</head>

<body>
  <header>
    <a href="/">Item Catalog</a>
    <a href="/item/new" class="btn">+ New Product</a>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>

</html>
